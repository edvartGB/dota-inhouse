app = "dota-inhouse"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/inhouse.db"
  LOG_PATH = "/data/inhouse.log"
  BASE_URL = "https://dndl.net"
  TZ = "Europe/Oslo"

[[mounts]]
  source = "dota_inhouse_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
