{{define "profile.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Dota Inhouse</title>
    <link rel="stylesheet" href="/static/styles.css?v=1">
</head>
<body>
    <header>
        <h1>Dota Inhouse</h1>
        <nav>
            <a href="/" class="nav-link">Queue</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/leaderboard" class="nav-link">Leaderboard</a>
            <a href="/profile" class="nav-link nav-link-active">Profile</a>
            {{if .User}}
                <span class="user-info">{{.User.Name}}</span>
                <a href="/auth/logout" class="btn btn-secondary">Logout</a>
            {{end}}
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="profile-shell">
                <div class="profile-card">
                    <div class="profile-card-header">
                        <p class="profile-kicker">Account Settings</p>
                        <h2>Profile</h2>
                        <p class="profile-help">Set your display name</p>
                    </div>
                    {{if .Error}}
                        <div class="notification error">{{.Error}}</div>
                    {{end}}

                    <form method="POST" action="/profile" class="profile-form">
                        <div class="profile-field">
                            <label for="display_name">Display name</label>
                            <input
                                type="text"
                                id="display_name"
                                name="display_name"
                                maxlength="32"
                                value="{{.DisplayName}}"
                                required
                                autocomplete="nickname"
                            >
                            <p class="profile-limit">Up to 32 characters.</p>
                        </div>
                        <div class="profile-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
{{end}}
