{{define "profile.html"}}
{{template "layout-start" (layout "Profile" "/profile" .User .IsAdmin)}}
        <div class="container">
            <section class="profile-shell">
                <div class="profile-card">
                    <div class="profile-card-header">
                        <p class="profile-kicker">Account Settings</p>
                        <h2>Profile</h2>
                        <p class="profile-help">Set the display name shown in queue, drafts, and match history.</p>
                    </div>
                    {{if .Error}}
                        <div class="notification error">{{.Error}}</div>
                    {{end}}

                    <form method="POST" action="/profile" class="profile-form">
                        <div class="profile-field">
                            <label for="display_name">Display name</label>
                            <input
                                type="text"
                                id="display_name"
                                name="display_name"
                                maxlength="32"
                                value="{{.DisplayName}}"
                                required
                                autocomplete="nickname"
                            >
                            <p class="profile-limit">Up to 32 characters.</p>
                        </div>

                        <div class="profile-actions">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </section>
        </div>
{{template "layout-end"}}
{{end}}
