{{define "admin-settings.html"}}
{{template "layout-start" (layout "Admin Settings" "/admin" .User true)}}
        <div class="container">
            <h2 class="page-title">Admin Lobby Settings</h2>
            <div class="admin-section">
                <h3>Lobby Settings</h3>
                <form class="settings-form" action="/admin/settings" method="POST">
                    <div>
                        <label for="game_mode">Game Mode</label>
                        <select name="game_mode" id="game_mode">
                            {{range $key, $name := .ValidGameModes}}
                            <option value="{{$key}}" {{if eq $key $.LobbySettings.GameMode}}selected{{end}}>{{$name}}</option>
                            {{end}}
                        </select>
                    </div>
                    <div>
                        <label for="league_id">League ID</label>
                        <input type="number" min="0" step="1" name="league_id" id="league_id" value="{{.LobbySettings.LeagueID}}">
                    </div>
                    <button type="submit" class="btn btn-primary btn-small">Save Settings</button>
                </form>
            </div>
            <div class="admin-section">
                <h3>Queue Controls</h3>
                <div class="queue-controls">
                    <span class="queue-status">Current status: {{if .QueueOpen}}Open{{else}}Closed{{end}}</span>
                    <form action="/admin/queue/open" method="POST">
                        <button type="submit" class="btn btn-primary btn-small" {{if .QueueOpen}}disabled{{end}}>Open Queue</button>
                    </form>
                    <form action="/admin/queue/close" method="POST">
                        <button type="submit" class="btn btn-danger btn-small" {{if not .QueueOpen}}disabled{{end}}>Close Queue</button>
                    </form>
                </div>
            </div>
        </div>
{{template "layout-end"}}
{{end}}
