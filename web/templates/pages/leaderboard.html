{{define "leaderboard.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Dota Inhouse</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>Dota Inhouse</h1>
        <nav>
            <a href="/" class="nav-link">Queue</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/leaderboard" class="nav-link">Leaderboard</a>
            {{if .User}}
                <span class="user-info">{{.User.Name}}</span>
                <a href="/auth/logout" class="btn btn-secondary">Logout</a>
            {{else}}
                <a href="/auth/login" class="btn btn-primary">Login with Steam</a>
            {{end}}
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="leaderboard-header">
                <h2>Leaderboard</h2>
                <span class="filter-label">{{.FilterName}}</span>
            </div>

            <div class="leaderboard-filters">
                <div class="preset-filters">
                    <a href="/leaderboard?sort={{.SortBy}}&dir={{.SortDir}}" class="btn btn-secondary {{if eq .FilterName "All Time"}}active{{end}}">All Time</a>
                    <a href="/leaderboard?preset=week&sort={{.SortBy}}&dir={{.SortDir}}" class="btn btn-secondary {{if eq .FilterName "Last 7 Days"}}active{{end}}">Week</a>
                    <a href="/leaderboard?preset=month&sort={{.SortBy}}&dir={{.SortDir}}" class="btn btn-secondary {{if eq .FilterName "Last 30 Days"}}active{{end}}">Month</a>
                    <a href="/leaderboard?preset=year&sort={{.SortBy}}&dir={{.SortDir}}" class="btn btn-secondary {{if eq .FilterName "Last Year"}}active{{end}}">Year</a>
                </div>
                <form class="date-filters" method="GET" action="/leaderboard">
                    <input type="date" name="start" value="{{.StartDate}}" placeholder="Start date">
                    <input type="date" name="end" value="{{.EndDate}}" placeholder="End date">
                    <input type="hidden" name="sort" value="{{.SortBy}}">
                    <input type="hidden" name="dir" value="{{.SortDir}}">
                    <button type="submit" class="btn btn-primary">Filter</button>
                </form>
            </div>

            <form id="leaderboard-state">
                <input type="hidden" name="start" value="{{.StartDate}}">
                <input type="hidden" name="end" value="{{.EndDate}}">
                <input type="hidden" name="preset" value="{{.Preset}}">
            </form>

            <div id="leaderboard-content">
                {{template "leaderboard-table" .}}
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
{{end}}
