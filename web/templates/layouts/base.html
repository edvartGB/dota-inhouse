{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota Inhouse</title>
    <meta name="description" content="Dota 2 inhouse matchmaking queue">
    <meta name="theme-color" content="#d32f2f">

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

    <!-- iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-title" content="DNDL">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <!-- iOS requires 180x180 icon for best results -->
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-192.png">

    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/htmx-sse.js"></script>
    <link rel="stylesheet" href="/static/styles.css?v=1">
</head>
<body>
    <header>
        <h1>Dota Inhouse</h1>
        <nav>
            <a href="/" class="nav-link nav-link-active">Queue</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/leaderboard" class="nav-link">Leaderboard</a>
            <a href="/profile" class="nav-link">Profile</a>
            {{if .IsAdmin}}<a href="/admin" class="nav-link">Admin</a>{{end}}
            {{if .User}}
                <span class="user-info">{{.User.Name}}</span>
                <a href="/auth/logout" class="btn btn-secondary">Logout</a>
            {{else}}
                <a href="/auth/login" class="btn btn-primary">Login with Steam</a>
            {{end}}
        </nav>
    </header>

    <main>
        {{template "content" .}}
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
{{end}}
